tion:column;gap:4px;margin-bottom:12px}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inline-fields .field-row{min-width:0}.version-category{display:grid;grid-template-columns:130px 100px 160px;gap:10px}.version-category .field-row{min-width:0}.event-picker{display:grid;grid-template-columns:minmax(160px,1fr) 2fr;gap:10px;align-items:start}.event-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}.event-choice{padding:5px 7px!important;font-size:.7rem!important}.field-row label{font-size:.75rem;color:#78716c;font-weight:500;letter-spacing:.01em}.check-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem;color:#a8a29e}.script-entry{background:#141210;border:1px solid #3a3530;border-radius:8px;padding:14px;margin-bottom:12px;position:relative}.script-entry .remove-entry{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);border-radius:5px;padding:2px 8px;cursor:pointer;font-size:.72rem;font-weight:600}.preview{background:#141210;border:1px solid #3a3530;border-radius:8px;padding:16px;font-family:'Fira Code',monospace;font-size:.8rem;color:#fb923c;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}select{background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 10px;border-radius:7px;font-size:.85rem;width:100%}select:focus{outline:none;border-color:#cc785c}#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:9px;font-size:.85rem;font-weight:500;display:none;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.4)}h2{font-size:.95rem;font-weight:600;color:#a8a29e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}.browse-controls{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}.search-row{display:flex;gap:10px;align-items:center;width:100%}.filter-panel{width:100%;padding:12px;background:#211e1b;border:1px solid #3a3530;border-radius:9px;box-sizing:border-box}.filter-grid{display:grid;grid-template-columns:repeat(5,max-content);gap:10px;align-items:end}.filter-grid select{width:auto;min-width:110px;max-width:180px}.filter-grid input[type=text]{width:150px}.filter-grid label{display:flex;flex-direction:column;gap:5px;color:#a8a29e;font-size:.78rem}.filter-grid input{background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 10px;border-radius:7px;font-size:.85rem;min-width:0}.search-input{background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 12px;border-radius:7px;font-size:.875rem;flex:1;min-width:180px;transition:border-color .15s}.search-input:focus{outline:none;border-color:#cc785c;box-shadow:0 0 0 3px rgba(204,120,92,.15)}.search-input::placeholder{color:#5a524a}.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid #3a3530;background:#2c2825;color:#78716c;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s}.filter-btn.active{background:rgba(204,120,92,.2);color:#cc785c;border-color:rgba(204,120,92,.4)}.filter-btn:hover:not(.active){color:#d6cfc8;border-color:#5a524a}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#1a1816}::-webkit-scrollbar-thumb{background:#3a3530;border-radius:3px}.star-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px 6px;line-height:1;color:#5a524a;transition:color .15s}.star-btn.active{color:#fbbf24}.star-btn:hover{color:#fbbf24}.eye-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:3px 8px;color:#78716c;line-height:1}.eye-btn.hidden{color:#cc785c}.eye-btn:hover{color:#f5f0eb}.pop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.pop-card{background:#211e1b;border:1px solid #3a3530;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}.pop-card:hover{border-color:#5a524a}.repo-img{width:100%;height:80px;object-fit:cover;border-radius:6px;back s="search-row"><input class="search-input" id="search" type="text" placeholder="Search scripts..." oninput="filterScripts()"><button class="btn-secondary" id="filter-toggle" onclick="toggleFilterPanel()">Filter &#9661;</button></div><div id="filter-panel" class="filter-panel" style="display:none"><div class="filter-grid"><label>JsMacros<select id="version-filter" onchange="filterScripts()"><option value="all">All</option><option value="legacy">Legacy</option><option value="community">Community</option><option value="reload">Reload</option></select></label><label>Category<select id="category-filter" onchange="filterScripts()"><option value="all">All</option><option value="macro">Macro</option><option value="api">API</option><option value="exe">Exe</option><option value="appimage">Appimage</option><option value="mod">Mod</option><option value="extension">Extension</option></select></label><label>Languages<input id="lang-search" type="text" placeholder="lua, js, py..." oninput="filterScripts()"></label><label>Server<input id="server-search" type="text" placeholder="Filter by server..." oninput="filterScripts()"></label><label>Sort by<select id="sort-select" onchange="filterScripts()"><option value="repo">Repo</option><option value="server">Server Name</option><option value="name">Script Names</option><option value="updated">Recently Updated</option></select></label><label style="flex-direction:row;align-items:center;gap:8px"><input id="hide-auto-generated" type="checkbox" style="width:auto" onchange="filterScripts()">Hide auto-generated</label></div></div></div><div id="repo-scope" style="display:none;align-items:center;gap:10px;color:#a8a29e;font-size:.85rem;margin-bottom:12px"></div><div class="grid" id="grid"><p style="color:#78716c">Loading...</p></div></div><div class="tab" id="tab-installed"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">Installed</h2><button class="btn-secondary" onclick="loadScripts()">Refresh</button></div><div class="grid" id="installed-grid"><p style="color:#78716c">Loading...</p></div></div><div class="tab" id="tab-repos"><div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-secondary" onclick="refreshRepos()">Refresh All</button></div><div class="repo-add"><h3>Add Repo</h3><div class="input-row"><input type="url" id="add-url" placeholder="https://raw.githubusercontent.com/.../manifest.json"><button class="btn-primary" onclick="addRepo()">Add</button><button class="btn-secondary" onclick="toggleBulkAdd()" id="bulk-toggle">Bulk &#9661;</button></div><div id="bulk-section" style="display:none;margin-top:12px"><label style="font-size:.75rem;color:#78716c;font-weight:500;display:block;margin-bottom:6px">Bulk Add (one URL per line)</label><textarea id="bulk-urls" rows="4" style="width:100%;background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 12px;border-radius:7px;font-size:.8rem;font-family:inherit;resize:vertical" placeholder="https://raw.githubusercontent.com/.../manifest.json&#10;https://..."></textarea><button class="btn-secondary" style="margin-top:8px" onclick="bulkAddRepos()">Add All</button></div><div id="add-msg"></div></div><div class="repo-list" id="repos-list"></div></div><div class="tab" id="tab-updates"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">Updates</h2><button class="btn-secondary" onclick="loadScripts()">Refresh</button></div><div class="grid" id="updates-grid"><p style="color:#78716c">Loading...</p></div></div><div class="tab" id="tab-manifest"><div class="mf-section"><h3>Import Existing Manifest</h3><div class="input-row"><input type="url" id="mf-import-url" placeholder="https://raw.githubusercontent.com/.../manifest.json"><button class="btn-secondary" onclick="importManifest()">Import</button></div></div><div class="two-col"><div><div class="mf-section"><h3>Repo Info</h3><div class="inline-fields"><div class="field-row"><label>Name</label><input type="text" id="mf-name" oninput="updatePreview()"></div><div class="field-row"><label>Author</label><input type="text" id="mf-author" oninput="updatePreview()"></div></div><div class="field-row"><label>Source URL</label><input type="url" id="mf-source" oninput="updatePreview()"></div><button type="button" class="btn-secondary" style="margin-top:4px;font-size:.75rem" onclick="toggleRepoExtra(this)">Extra ▼</button><div id="mf-advanced" style="display:none"><div class="field-row"><label>Sub-repo URLs (one per line)</label><textarea id="mf-repos" rows="3" placeholder="Can add multiply repository manifest links here to make a master manifest" style="width:100%;background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 12px;border-radius:7px;font-size:.8rem;font-family:inherit;resize:vertical" oninput="updatePreview()"></textarea></div><div class="field-row"><label>Discord URL (optional)</label><input type="url" id="mf-discord" oninput="updatePreview()"></div><div class="field-row"><label>Donate URL (optional)</label><input type="url" id="mf-donate" oninput="updatePreview()"></div></div></div><div class="mf-section"><h3>Scripts</h3><div id="mf-scripts"></div><button class="btn-secondary" onclick="addScriptEntry()">+ Add Script</button></div></div><div><div class="mf-section"><h3>Preview</h3><textarea id="mf-preview" rows="18" style="width:100%;background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 12px;border-radius:7px;font-size:.78rem;font-family:monospace;resize:vertical">{}</textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn-primary" onclick="copyManifest()">Copy JSON</button><button class="btn-secondary" onclick="downloadManifest()">Download manifest.json</button><button class="btn-secondary" onclick="verifyManifest()">Verify</button></div></div></div></div></div><div class="tab" id="tab-popular"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">Popular Repos</h2><button class="btn-secondary" onclick="loadPopular()">Refresh</button></div><div class="pop-grid" id="pop-grid"><p style="color:#78716c">Loading...</p></div></div><div class="tab" id="tab-favorites"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">Favorites</h2></div><div class="grid" id="fav-grid"><p style="color:#78716c">Loading...</p></div></div><div class="tab" id="tab-settings"><h2>Settings</h2><div class="repo-add" style="max-width:560px"><label style="display:flex;align-items:center;gap:10px;color:#f5f0eb;font-size:.9rem"><input id="creator-mode" type="checkbox" style="width:auto" onchange="setCreatorMode(this.checked)">Creator Mode</label><div class="folder-input"><input id="exe-dir" type="text" placeholder="EXE download location" aria-label="EXE download location" onchange="saveInstallDirs()"><button type="button" class="btn-secondary" title="Choose EXE download location" aria-label="Choose EXE download location" onclick="chooseInstallDir('exe',this)">&#128193;</button></div><div class="folder-input"><input id="appimage-dir" type="text" placeholder="AppImage download location" aria-label="AppImage download location" onchange="saveInstallDirs()"><button type="button" class="btn-secondary" title="Choose AppImage download location" aria-label="Choose AppImage download location" onclick="chooseInstallDir('appimage',this)">&#128193;</button></div></div></div><div id="toast"></div><script>let activeRepoFilter='';let creatorMode=false;function showTab(id,btn){if(id==='manifest'&&!creatorMode)return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');if(btn)btn.classList.add('active');if(id==='repos')loadRepos();if(id==='popular')loadPopular();if(id==='favorites')loadFavoritesTab();if(id==='updates')loadUpdatesTab();if(id==='installed')loadInstalledTab();if(id==='settings')loadInstallDirs();}function setCreatorMode(enabled){creatorMode=!!enabled;try{localStorage.setItem('synapmc.creatorMode',creatorMode?'true':'false');}catch(e){}document.getElementById('creator-tab').style.display=creatorMode?'':'none';document.getElementById('creator-mode').checked=creatorMode;if(!creatorMode&&document.getElementById('tab-manifest').classList.contains('active'))showTab('settings',document.getElementById('settings-tab'));}try{setCreatorMode(localStorage.getItem('synapmc.creatorMode')==='true');}catch(e){setCreatorMode(false);}async function loadInstallDirs(){try{const r=await fetch('/api/settings/install-dirs');const d=await r.json();document.getElementById('exe-dir').value=d.exe||'';document.getElementById('appimage-dir').value=d.appimage||'';}catch(e){toast('Could not load install folders: '+e.message,false);}}let installDirSaves=Promise.resolve();function saveInstallDirs(){const body=JSON.stringify({exe:document.getElementById('exe-dir').value,appimage:document.getElementById('appimage-dir').value});installDirSaves=installDirSaves.then(async()=>{try{const r=await fetch('/api/settings/install-dirs',{method:'POST',headers:{'Content-Type':'application/json'},body});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not save locations');toast('Download locations saved.',true);}catch(e){toast('Save failed: '+e.message,false);}});return installDirSaves;}async function chooseInstallDir(kind,btn){btn.disabled=true;try{const r=await fetch('/api/settings/choose-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:document.getElementById(kind+'-dir').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Folder chooser failed');if(d.path!=null){document.getElementById(kind+'-dir').value=d.path;await saveInstallDirs();}}catch(e){toast(e.message,false);}finally{btn.disabled=false;}}functi ';const scope=document.getElementById('repo-scope');if(activeRepoFilter){scope.style.display='flex';scope.innerHTML=`Repo: <b style="color:#f5f0eb">${esc(activeRepoFilter)}</b><button class="btn-secondary" onclick="clearRepoFilter()">Clear</button>`;}else{scope.style.display='none';scope.innerHTML='';}if(!scripts.length){grid.innerHTML='<p style="color:#78716c">'+(allScripts.length?'No scripts match.':'No scripts found. Add a repo first.')+'</p>';return;}for(const sc of scripts){const card=document.createElement('div');card.className='card';let h='';const imageUrl=webUrl(sc.imageurl);if(imageUrl){h+=`<img class="card-background" src="${imageUrl}" alt="" onload="if(this.naturalWidth/this.naturalHeight>1.5)this.parentElement.classList.add('card-wide-image')" onerror="this.remove()">`;}const displayImageHeight=sc.imageWidth&&sc.imageHeight?Math.max(90,Math.min(210,300*sc.imageHeight/sc.imageWidth)):150;h+=`<div class="card-img-wrap" style="height:${displayImageHeight}px">`;if(imageUrl)h+=`<img class="card-img" src="${imageUrl}" alt="" onerror="this.parentElement.style.background='#2c2825'">`;h+=`<div class="card-details">`;h+=`<span style="font-size:.75rem;color:#a8a29e"><b style="color:#f5f0eb">Repo:</b> <button class="repo-inline" onclick="openRepo(${esc(JSON.stringify(sc.repoName||''))})">${esc(sc.repoName||'')}</button></span>`;const sourceUrl=webUrl(sc.repoSource);if(sourceUrl)h+=`<a class="btn btn-secondary" href="${sourceUrl}" target="_blank" rel="noopener noreferrer" style="font-size:.75rem;padding:4px 10px;text-align:center">Source</a>`;if(sc.installed)h+=`<button class="btn-secondary" style="font-size:.75rem;padding:4px 10px;text-align:center" onclick="revealScript(${esc(JSON.stringify(sc.name))})">Show in Folder</button>`;h+=`</div>`;h+=`</div>`;const starCls=sc.favorited?'star-btn active':'star-btn';h+=`<div style="display:flex;align-items:flex-start;gap:6px"><div class="card-title" style="flex:1;min-width:0">${esc(sc.name)}</div><div class="card-actions">` ersion||'?')} -> ${esc(sc.version||'?')}</span>`;if(sc.lang&&!(sc.lang==='jar'&&sc.category==='jar')){h+=languageBadge(sc.lang);}if(sc.installed)h+='<span class="badge b-inst">Installed</span>';if(sc.autoGenerated||sc.repoAutoGenerated)h+='<span class="badge b-auto">Auto-generated</span>';if(sc.mcVersion)h+=`<span class="badge b-ver">MC ${esc(sc.mcVersion)}</span>`;if(sc.category==='extension'&&sc.extensionEdition)h+=`<span class="badge b-ver">${esc(sc.extensionEdition)}</span>`;if(sc.category&&sc.category!=='macro')h+=`<span class="badge b-api">${esc(sc.category.toUpperCase())}</span>`;if(sc.jsmacrosVersion)h+=`<span class="badge b-ver" title="JsMacros version">${esc(sc.jsmacrosVersion)}</span>`;if(sc.hasRegister&&!sc.goesToMacros)h+='<span class="b-trigger">&#9888; trigger</span>';h+='</div>';if(sc.description&&!sc.autoGenerated)h+=`<div class="card-desc">${esc(sc.description)}</div>`;if(sc.changelog)h+=`<div class="card-desc"><b style="color:#d6cfc8">Changelog:</b> ${esc(sc.changelog)}</div>`;h+='<div class="btns">';if(sc.isExecuteReady){h+=`<button class="btn-exec" onclick="execScript(${esc(JSON.stringify(sc.name))})">Execute</button>`;}if(!sc.installed||sc.updateAvailable)h+=`<button class="btn-install" onclick="installScript(${esc(JSON.stringify(sc.name))})">${sc.installed?'Update':'Install'}</button>`;else h+=`<button class="btn-remove" onclick="removeScript(${esc(JSON.stringify(sc.name))})">Uninstall</button>`;h+='</div>';card.innerHTML=h;grid.appendChild(card);}}async function installScript(name){const res=await fetch('/api/scripts/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,location:'library'})});const d=await res.json();toast(d.ok?'Installed: '+name+(d.restart?' (restart Minecraft to load)':''):'Error: '+(d.error||'?'),d.ok);if(d.ok)loadScripts();}async function removeScript(name){const res=await fetch('/api/scripts/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nam o'||x.category==='api')&&x.lang){const lang=x.lang.toLowerCase();tags.add('.'+lang);}if(x.category==='mod')tags.add('Mods');if(x.category==='extension'){const ed=(x.extensionEdition||x.jsmacrosVersion||'').toLowerCase();if(ed.includes('legacy')||ed.includes('1.9'))tags.add('Legacy');else if(ed)tags.add(ed+' extensions');}}const generated=items.some(x=>x.repoAutoGenerated||x.autoGenerated);if(generated){const d=row.querySelector('.repo-desc');if(d&&d.textContent.toLowerCase().startsWith('auto-generated from github source'))d.remove();}if(tags.size||generated){const box=document.createElement('div');box.className='repo-tags';box.innerHTML=(generated?'<span class="badge b-auto">Auto-generated</span>':'')+Array.from(tags).map(t=>t.startsWith('.')?languageBadge(t.slice(1)):'<span class="badge b-ver">'+esc(t)+'</span>').join('');row.appendChild(box);}}}catch(e){list.innerHTML='<p style="color:#f87171">Failed to load repos: '+esc(e.message)+'</p>';}}function openRepo(name){activeRepoFilter=name;const search=document.getElementById('search');if(search)search.value='';const browseBtn=document.querySelector('nav button');showTab('browse',browseBtn);toast('Showing repo: '+name,true);filterScripts();}function clearRepoFilter(){activeRepoFilter='';filterScripts();}async function toggleRepoHidden(name,hidden){const url=hidden?'/api/repos/show':'/api/repos/hide';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const d=await r.json();toast(d.ok?(hidden?'Repo shown in Browse':'Repo hidden from Browse'):'Error: '+(d.error||'?'),!!d.ok);loadRepos();loadScripts();}catch(e){toast('Repo visibility failed: '+e.message,false);}}async function removeRepo(name){const res=await fetch('/api/repos/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const d=await res.json();toast(d.ok?'Removed repo: '+name:'Error: '+(d.error||'?'),d.ok);if(d.ok){loadRepos();loadScripts();}}async function addRepo(){const url=document.getElementById('add-url').value.trim();const msg=document.getElementById('add-msg');if(!url){msg.innerHTML='<div class="msg msg-err">Enter a URL.</div>';return;}msg.innerHTML='<div class="msg" style="background:#2d3436">Adding...</div>';try{const res=await fetch('/api/repos/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await res.json();if(d.ok){msg.innerHTML='<div class="msg msg-ok">Repo added.</div>';document.getElementById('add-url').value='';loadRepos();loadScripts();}else msg.innerHTML=`<div class="msg msg-err">${esc(d.error||'Failed')}</div>`;}catch(e){msg.innerHTML=`<div class="msg msg-err">${esc(e.message)}</div>`;}}async function bulkAddRepos(){const raw=document.getElementById('bulk-urls').value;const urls=raw.split('\n').map(u=>u.trim()).filter(u=>u.length>0);const msg=document.getElementById('add-msg');if(!urls.length){msg.innerHTML='<div class="msg msg-err">Enter at least one URL.</div>';return;}msg.innerHTML='<div class="msg" style="background:#2d3436">Adding...</div>';try{const res=await fetch('/api/repos/bulk-add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})});const d=await res.json();if(d.errors&&d.errors.length)msg.innerHTML=`<div class="msg msg-err">Added ${d.added}. Errors:<br>${d.errors.map(e=>esc(e)).join('<br>')}</div>`;else{msg.innerHTML=`<div class="msg msg-ok">Added ${d.added} repo(s).</div>`;document.getElementById('bulk-urls').value='';}loadRepos();loadScripts();}catch(e){msg.innerHTML=`<div class="msg msg-err">${esc(e.message)}</div>`;}}async function refreshRepos(){toast('Refreshing...',true);try{const res=await fetch('/api/repos/refresh',{method:'POST'});const d=await res.json();if(d.ok){toast('Repos refreshed.',true);loadRepos();loadScripts();}else toast('Refresh failed: '+(d.error||'?'),false);}catch(e){toast('Refresh failed: '+e.message,false);}}let scriptCount=0;function addScriptEntry(){const id='se'+scriptCount++;const div=document.createElement('div');div.className='script-entry';div.id=id;div.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center"><button class="remove-entry" onclick="document.getElementById('${id}').remove();updatePreview()">Remove</button><button type="button" class="btn-secondary" style="font-size:.72rem;padding:2px 8px" onclick="duplicateEntry('${id}')">Duplicate</button><span class="se-collapsed-name" style="display:none;font-size:.8rem;color:#d6cfc8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px"></span><button type="button" class="btn-secondary" style="margin-left:auto;font-size:.72rem;padding:2px 8px" onclick="collapseEntry('${id}',this)">&#9660;</button></div><div class="se-body" id="${id}-body"><div class="inline-fields"><div class="field-row"><label>Name</label><input type="text" class="se-name" oninput="updatePreview()"></div><div class="field-row"><label>Author</label><input type="text" class="se-author" oninput="updatePreview()"></div></div><div class="version-category"><div class="field-row"><label>Category</label><select class="se-category" onchange="onCategoryChange(this);updatePreview()"><option value="macro">macro</option><option value="api">api</option><option value="exe">exe</option><option value="appimage">appimage</option><option value="mod">mod</option><option value="extension">extension</option></select></div><div class="field-row"><label>Version</label><input type="text" class="se-ver" value="1.0.0" oninput="updatePreview()"></div><div class="field-row"><label>JsMacros Version</label><select class="se-jsmver" aria-label="JsMacros Version" onchange="updatePreview()"><option value="all">All</option><option value="" disabled hidden></option><option value="legacy">Legacy</option><option value="community">Community</option><option value="reload">Reloaded</option></select></div></div><div class="field-row se-mod-version-row" style="display:none"><label>Minecraft version tag</label><input type="text" class="se-mc-version" placeholder="e.g. 1.21.1" oninput="updatePreview()"></div><div class="field-row"><label>Description</label><input type="text" class="se-desc" oninput="updatePreview()"></div><div class="field-row"><label>Image Url (optional)</label><input type="url" class="se-img" placeholder="Recommended 640×360" oninput="updatePreview()"></div><div class="field-row"><label>Server (optional, leave blank for all)</label><input type="text" class="se-server" placeholder="e.g. hypixel.net" oninput="updatePreview()"></div><div class="se-source-row"><div class="field-row"><label class="se-source-label">Source URL</label><input type="url" class="se-source" oninput="updatePreview()"></div></div><button type="button" class="btn-secondary" style="font-size:.75rem;margin-top:4px" onclick="toggleEntryAdv(this)">Extra ▼</button><div class="se-adv" style="display:none"><div class="field-row"><label>Register Type</label><select class="se-reg" onchange="updateRegFields(this);updatePreview()"><option value="">None</option><option value="keydown">keydown</option><option value="keyup">keyup</option><option value="event">event</option></select></div><div class="se-reg-key" style="display:none"><div class="field-row"><label>Key (e.g. key.keyboard.keypad.4)</label><input type="text" class="se-key" oninput="updatePreview()"></div></div><div class="se-reg-event" style="display:none"><div class="event-picker"><div class="field-row"><label>Event</label><input type="text" class="se-event" placeholder="Choose or type an event" oninput="updatePreview()"></div><div class="event-grid"><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'AirChange')">AirChange</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'ArmorChange')">ArmorChange</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'BlockUpdate')">BlockUpdate</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'BossBarUpdate')">BossBarUpdate</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'ChunkLoad')">ChunkLoad</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'ChunkUnload')">ChunkUnload</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Damage')">Damage</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Death')">Death</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'DimensionChange')">DimensionChange</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Disconnect')">Disconnect</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'EXP_Change')">EXP_Change</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'HeldItem')">HeldItem</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'HungerChange')">HungerChange</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'ItemDamage')">ItemDamage</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Item_Pickup')">Item_Pickup</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'JoinServer')">JoinServer</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'JoinedWorld')">JoinedWorld</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'LeftWorld')">LeftWorld</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Key')">Key</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'OpenScreen')">OpenScreen</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'PlayerJoin')">PlayerJoin</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'PlayerLeave')">PlayerLeave</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'ProfileLoad')">ProfileLoad</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'RecvMessage')">RecvMessage</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'SendMessage')">SendMessage</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'SignEdit')">SignEdit</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Sound')">Sound</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Tick')">Tick</button><button type="button" class="btn-secondary event-choice" onclick="chooseEvent(this,'Title')">Title</button></div></div></div><div class="field-row"><label>Changelog</label><textarea class="se-changelog" rows="3" style="width:100%;background:#141210;border:1px solid #3a3530;color:#f5f0eb;padding:8px 12px;border-radius:7px;font-size:.8rem;font-family:inherit;resize:vertical" oninput="updatePreview()"></textarea></div></div></div>`;document.getElementById('mf-scripts').appendChild(div);onCategoryChange(div.querySelector('.se-category'));updatePreview();}function updateRegFields(sel){const entry=sel.closest('.script-entry');entry.querySelector('.se-reg-key').style.display=(sel.value==='keydown'||sel.value==='keyup')?'block':'none';entry.querySelector('.se-reg-event').style.display=sel.value==='event'?'block':'none';}function chooseEvent(btn,name){const input=btn.closest('.event-picker').querySelector('.se-event');input.value=name;updatePreview();}function onCategoryChange(sel){const entry=sel.closest('.script-entry');entry.querySelector('.se-mod-version-row').style.display=sel.value==='mod'?'block':'none';const version=entry.querySelector('.se-jsmver');const required=sel.value==='extension';const all=version.querySelector('option[value=all]');all.hidden=required;all.disabled=required;version.required=required;if(required&&version.value==='all')version.value='';if(!required&&!version.value)version.value='all';}function toggleEntryAdv(btn){const d=btn.nextElementSibling;const open=d.style.display==='none';d.style.display=open?'block':'none';btn.textContent='Extra '+(open?'\u25B2':'\u25BC');}function collapseEntry(id,btn){const entry=document.getElementById(id);const body=document.getElementById(id+'-body');const open=body.style.display!=='none';body.style.display=open?'none':'block';btn.innerHTML=open?'&#9654;':'&#9660;';const nameSpan=entry.querySelector('.se-collapsed-name');if(open){const n=entry.querySelector('.se-name').value;nameSpan.textContent=n;nameSpan.style.display=n?'':'none';}else{nameSpan.style.display='none';}}function duplicateEntry(id){const src=document.getElementById(id);const newId='se'+scriptCount++;const clone=src.cloneNode(true);clone.id=newId;clone.innerHTML=clone.innerHTML.replace(new RegExp(id,'g'),newId);const values=src.querySelectorAll('input,select,textarea');clone.querySelectorAll('input,select,textarea').forEach((field,i)=>{field.value=values[i].value;field.checked=values[i].checked;});src.parentNode.insertBefore(clone,src.nextSibling);onCategoryChange(clone.querySelector('.se-category'));updatePreview();}function buildManifest(){const reposRaw=document.getElementById('mf-repos').value.split('\n').map(u=>u.trim()).filter(u=>u.length>0);const m={name:document.getElementById('mf-name').value,source:document.getElementById('mf-source').value,author:document.getElementById('mf-author').value,repos:reposRaw.length?reposRaw:undefined,discordUrl:document.getElementById('mf-discord').value||undefined,donateUrl:document.getElementById('mf-donate').value||undefined,scripts:[]};document.querySelectorAll('.script-entry').forEach(e=>{const reg=e.querySelector('.se-reg').value;let register=null;if(reg==='keydown'||reg==='keyup')register={type:reg,key:e.querySelector('.se-key').value};if(reg==='event')register={type:'event',event:e.querySelector('.se-event').value};m.scripts.push({name:e.querySelector('.se-name').value,author:e.querySelector('.se-author').value,source:e.querySelector('.se-source').value,version:e.querySelector('.se-ver').value,changelog:e.querySelector('.se-changelog').value||null,description:e.querySelector('.se-desc').value,imageurl:e.querySelector('.se-img').value||null,imageWidth:Number(e.dataset.imageWidth)||undefined,imageHeight:Number(e.dataset.imageHeight)||undefined,category:e.querySelector('.se-category').value,isExecuteReady:e.querySelector('.se-category').value==='macro',mcVersion:e.querySelector('.se-category').value==='mod'?(e.querySelector('.se-mc-version').value||null):null,extensionEdition:e.querySelector('.se-category').value==='extension'?(e.querySelector('.se-jsmver').value||null):null,jsmacrosVersion:e.querySelector('.se-jsmver').value==='all'?null:e.querySelector('.se-jsmver').value||null,server:e.querySelector('.se-server').value||null,register});});return m;}function manifestEdition(value){const v=String(value||'').toLowerCase();return['1.9.2','legacy'].includes(v)?'legacy':['2.0.0','ce','community','jsmacrosce','new'].includes(v)?'community':['reload','reloaded'].includes(v)?'reload':v==='all'?'':v;}function validateManifest(){for(const entry of document.querySelectorAll('.script-entry')){const version=entry.querySelector('.se-jsmver');if(version.required&&!version.value){toast('Select a JsMacros version for each extension.',false);version.reportValidity();return false;}}return true;}function updatePreview(){document.getElementById('mf-preview').value=JSON.stringify(buildManifest(),null,2);}function copyManifest(){if(!validateManifest())return;navigator.clipboard.writeText(JSON.stringify(buildManifest(),null,2)).then(()=>toast('Copied!',true)).catch(()=>toast('Copy failed',false));}function downloadManifest(){if(!validateManifest())return;const blob=new Blob([JSON.stringify(buildManifest(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manifest.json';a.click();}async function revealScript(name){const res=await fetch('/api/scripts/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const d=await res.json();if(!d.ok)toast('Error: '+(d.error||'?'),false);}async function importManifest(){const url=document.getElementById('mf-import-url').value.trim();if(!url){toast('Enter a manifest URL first',false);return;}try{const res=await fetch('/api/manifest/fetch?url='+encodeURIComponent(url));const m=await res.json();if(m.error){toast('Import failed: '+m.error,false);return;}populateManifest(m);toast('Imported!',true);}catch(e){toast('Import failed: '+e.message,false);}}function populateManifest(m){if(m.name)document.getElementById('mf-name').value=m.name;if(m.source)document.getElementById('mf-source').value=m.source;if(m.author)document.getElementById('mf-author').value=m.author;if(m.repos&&m.repos.length)document.getElementById('mf-repos').value=m.repos.join('\n');if(m.discordUrl)document.getElementById('mf-discord').value=m.discordUrl;if(m.donateUrl)document.getElementById('mf-donate').value=m.donateUrl;document.getElementById('mf-scripts').innerHTML='';scriptCount=0;if(m.scripts&&m.scripts.length){for(const sc of m.scripts){addScriptEntry();const entries=document.querySelectorAll('.script-entry');const e=entries[entries.length-1];if(sc.name)e.querySelector('.se-name').value=sc.name;if(sc.author)e.querySelector('.se-author').value=sc.author;if(sc.source)e.querySelector('.se-source').value=sc.source;if(sc.version)e.querySelector('.se-ver').value=sc.version;if(sc.changelog)e.querySelector('.se-changelog').value=sc.changelog;if(sc.description)e.querySelector('.se-desc').value=sc.description;if(sc.imageurl)e.querySelector('.se-img').value=sc.imageurl;if(sc.imageWidth)e.dataset.imageWidth=sc.imageWidth;if(sc.imageHeight)e.dataset.imageHeight=sc.imageHeight;if(sc.category){const cat=sc.category==='jar'?'extension':sc.category;e.querySelector('.se-category').value=cat;onCategoryChange(e.querySelector('.se-category'));}if(sc.mcVersion)e.querySelector('.se-mc-version').value=sc.mcVersion;if(sc.register&&sc.register.type){const sel=e.querySelector('.se-reg');sel.value=sc.register.type;updateRegFields(sel);if(sc.register.key)e.querySelector('.se-key').value=sc.register.key;if(sc.register.event)e.querySelector('.se-event').value=sc.register.event;}const version=e.querySelector('.se-jsmver');const raw=sc.category==='extension'||sc.category==='jar'?sc.extensionEdition||sc.jsmacrosVersion:sc.jsmacrosVersion;const selected=manifestEdition(raw);if(selected&&!Array.from(version.options).some(o=>o.value===selected))version.add(new Option(selected,selected));version.value=selected||(version.required?'':'all');onCategoryChange(e.querySelector('.se-category'));if(sc.server)e.querySelector('.se-server').value=sc.server;}}updatePreview();}function verifyManifest(){try{const m=JSON.parse(document.getElementById('mf-preview').value);populateManifest(m);if(validateManifest())toast('Verified!',true);}catch(e){toast('Invalid JSON: '+e.message,false);}}async function toggleFavorite(name,btn){const isFav=btn.classList.contains('active');const url=isFav?'/api/favorites/remove':'/api/favorites/add';try{await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});btn.classList.toggle('active');btn.title=btn.classList.contains('active')?'Remove from favorites':'Add to favorites';const sc=allScripts.find(s=>s.name===name);if(sc)sc.favorited=!isFav;}catch(e){toast('Favorite failed: '+e.message,false);}}async function loadFavoritesTab(){const grid=document.getElementById('fav-grid');const favs=allScripts.filter(s=>s.favorited);if(!favs.length){grid.innerHTML='<p style="color:#78716c">No favorites yet. Star scripts in Browse to add them.</p>';return;}renderScriptsTo(favs,grid);}async function loadUpdatesTab(){const grid=document.getElementById('updates-grid');const updates=allScripts.filter(s=>s.installed&&s.updateAvailable);if(!updates.length){grid.innerHTML='<p style="color:#78716c">Everything installed is up to date.</p>';return;}renderScriptsTo(updates,grid);}async function loadPopular(){const grid=document.getElementById('pop-grid');grid.innerHTML='<p style="color:#78716c">Loading...</p>';try{const res=await fetch('/api/popular');const data=await res.json();if(data.error){grid.innerHTML=`<p style="color:#f87171">${esc(data.error)}</p>`;return;}if(!data.length){grid.innerHTML='<p style="color:#78716c">No popular repos found.</p>';return;}grid.innerHTML=data.map(r=>{const addedLabel=r.added?'<span class="badge b-inst">Added</span>':'';const addBtn=r.added?'':`<button class="btn-primary" onclick="addRepoByUrl(${esc(JSON.stringify(r.url))},this)">Add</button>`;return`<div class="pop-card"><div class="card-title">${esc(r.name)}</div><div class="card-meta" style="word-break:break-all">${esc(r.url)}</div><div class="btns">${addedLabel}${addBtn}</div></div>`;}).join('');}catch(e){grid.innerHTML=`<p style="color:#f87171">${esc(e.message)}</p>`;}}async function addRepoByUrl(url,btn){btn.disabled=true;btn.textContent='Adding...';try{const r=await fetch('/api/repos/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(d.ok){toast('Repo added.',true);btn.replaceWith(document.createTextNode(''));loadScripts();loadPopular();}else{toast('Error: '+(d.error||'?'),false);btn.disabled=false;btn.textContent='Add';}}catch(e){toast(e.message,false);btn.disabled=false;btn.textContent='Add';}}function renderScriptsTo(scripts,container){container.innerHTML='';for(const sc of scripts){const card=document.createElement('div');card.className='card favorite-card';let h='';const imageUrl=webUrl(sc.imageurl);if(imageUrl)h+=`<img class="favorite-image" src="${imageUrl}" alt="" onerror="this.style.display='none'">`;h+=`<div class="card-title">${esc(sc.name)}</div>`;h+=`<div class="card-meta">by ${esc(sc.author||'Unknown')} &bull; ${esc(sc.repoName||'')}</div>`;h+='<div class="badges">';h+=`<span class="badge b-ver">v${esc(sc.version||'?')}</span>`;if(sc.updateAvailable)h+=`<span class="badge b-inst">Update ${esc(sc.installedVersion||'?')} -> ${esc(sc.version||'?')}</span>`;if(sc.installed)h+='<span class="badge b-inst">Installed</span>';if(sc.autoGenerated||sc.repoAutoGenerated)h+='<span class="badge b-auto">Auto-generated</span>';if(sc.mcVersion)h+=`<span class="badge b-ver">MC ${esc(sc.mcVersion)}</span>`;if(sc.category==='extension'&&sc.extensionEdition)h+=`<span class="badge b-ver">${esc(sc.extensionEdition)}</span>`;h+='</div>';if(sc.description&&!sc.autoGenerated)h+=`<div class="card-desc">${esc(sc.description)}</div>`;if(sc.changelog)h+=`<div class="card-desc"><b style="color:#d6cfc8">Changelog:</b> ${esc(sc.changelog)}</div>`;h+='<div class="btns">';if(!sc.installed||sc.updateAvailable)h+=`<button class="btn-install" onclick="installScript(${esc(JSON.stringify(sc.name))})">${sc.installed?'Update':'Install'}</button>`;else{h+=`<button class="btn-remove" onclick="removeScript(${esc(JSON.stringify(sc.name))})">Uninstall</button>`;}h+='</div>';card.innerHTML=h;container.appendChild(card);}}refreshRepos();</script></body></html>
